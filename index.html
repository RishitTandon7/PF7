<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rishit Tandon | AI/ML Engineer & Full-Stack Dev Portfolio</title>

    <!--SEO_HEAD-->
    <!-- fonts: loaded without blocking first paint (the page paints in system fonts, then swaps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=JetBrains+Mono:wght@400;500;700;800&family=Permanent+Marker&family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,500;0,800;1,500&family=Chakra+Petch:wght@500;700&family=Archivo+Black&family=Barlow+Condensed:wght@500;700;800&family=Instrument+Serif:ital@0;1&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" /></noscript>
    <style>
      /* critical css: the crawlable fallback + plain-text sections paint instantly, before any script or font arrives */
      html{background:#0b0b0c}
      body{margin:0;background:#0b0b0c;color:#d8d0bd;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace}
      .ssr{padding:72px 6vw 40px;max-width:900px}
      .ssr h1{font-size:clamp(28px,5vw,52px);line-height:1.05;letter-spacing:-.04em;color:#f2ecdf;margin:0 0 16px}
      .ssr p{max-width:62ch;color:#c9c1ad}
      .ssr a,#seo-home a{color:#ffb000}
      #seo-home{padding:60px 6vw 150px;border-top:2px dashed #26231d;background:#0b0b0c;color:#d8d0bd}
      #seo-home section{max-width:900px;margin:0 auto 34px}
      #seo-home h2{font-size:clamp(20px,3vw,28px);color:#f2ecdf;margin:0 0 10px;letter-spacing:-.02em}
      #seo-home h3{font-size:14px;color:#39d353;margin:16px 0 4px}
      #seo-home ul{padding-left:20px;margin:6px 0}
      #seo-home .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 24px}
      #seo-home dt{color:#f2ecdf;font-weight:700;margin-top:14px}
      #seo-home dd{margin:2px 0 0;color:#c9c1ad}
    </style>
  </head>
  <body>
    <noscript>This site is interactive and uses JavaScript. All of it is also readable as plain text below. Email: rishit.tandon.7@gmail.com</noscript>
    <div id="root"></div>

  </body>
</html>
